[project]
name = "mother"
version = "2.0.0"
description = "本地 Office + 飞书 AI 办公助手"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "lark-oapi>=1.3.0",
    "openpyxl>=3.1.0",
    "pywin32>=306",
    "httpx>=0.27.0",
]

[project.scripts]
mother = "main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
